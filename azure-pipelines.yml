

trigger:
  - develop
pool:
  name: "Self-Hosted"

variables:
  TF_VERSION: "1.6.6"
  TF_WORKING_DIR: "terraform/infra/azure"

stages:
  - stage: Terraform
    jobs:
      - job: DeployInfra
        steps:
          # 1️⃣ Checkout code
          - checkout: self

          # 2️⃣ Install Terraform
          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: $(TF_VERSION)

          # 2️⃣ Install Azure CLI if not present
          - task: Bash@3
            displayName: Install Azure CLI if missing
            inputs:
              targetType: inline
              script: |
                set -e

                if command -v az >/dev/null 2>&1; then
                  echo "Azure CLI already installed:"
                  az version
                else
                  echo "Azure CLI not found. Installing..."
                  curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
                  az version
                fi
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: 'ado-terraform-oidc'
              backendAzureRmStorageAccountName: 'terraformstate10032'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'chat-app-kindvm'
          
