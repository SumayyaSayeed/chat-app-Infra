
# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- xx

pool:
  name:  'Self-Hosted'

variables:
  TF_VERSION: '1.6.6'
  TF_WORKING_DIR: 'terraform/infra/azure'

stages:
- stage: Terraform
  jobs:
  - job: DeployInfra
    steps:

    # 1️⃣ Checkout code
    - checkout: self

    # 2️⃣ Install Terraform
    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: $(TF_VERSION)

# 2️⃣ Authenticate to Azure (OIDC / SP) 
    - task: AzureCLI@2
      displayName: Terraform Init / Plan / Apply
      inputs:
        azureSubscription: ado-terraform-oidc  # service connection ONLY here
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
         set -e
          cd $(TF_WORKING_DIR)

         terraform --version

         terraform init
         terraform plan
         terraform apply -auto-approve