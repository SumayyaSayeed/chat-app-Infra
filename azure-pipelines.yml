

trigger:
  - develop
pool:
  name: "Self-Hosted"

variables:
  TF_VERSION: "1.6.6"
  TF_WORKING_DIR: "terraform/infra/azure"

stages:
  - stage: Terraform
    jobs:
      - job: Installdependenciesandtfplan
        steps:
          #  Checkout code
          - checkout: self

          #  Install Terraform
          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: $(TF_VERSION)

          #  Install Azure CLI if not present
          - task: Bash@3
            displayName: Install Azure CLI if missing
            inputs:
              targetType: inline
              script: |
                set -e

                if command -v az >/dev/null 2>&1; then
                  echo "Azure CLI already installed:"
                  az version
                else
                  echo "Azure CLI not found. Installing..."
                  curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
                  az version
                fi
          - task: TerraformTask@5
            displayName: terraform init
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(TF_WORKING_DIR)'
              backendServiceArm: 'ado-terraform-oidc'
              backendAzureRmStorageAccountName: 'terraformstate10032'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'chat-app-kindvm'
          - task: TerraformTask@5
            displayName: terraform validate
            inputs:
             provider: 'azurerm'
             command: 'validate'
             workingDirectory: '$(TF_WORKING_DIR)'
          - task: TerraformTask@5
            displayName: terraform plan
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(TF_WORKING_DIR)'
              environmentServiceNameAzureRM: 'ado-terraform-oidc'
          - task: TerraformTask@5
            displayName: terraform apply
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(TF_WORKING_DIR)'
              environmentServiceNameAzureRM: 'ado-terraform-oidc'
          - task: Bash@3
            displayName: K8scheck
            inputs:
              targetType: inline
              script: |
                set -x
                kubectl config get-contexts
                kubectl get nodes
                kubecl get ns

          
  - stage: Destroy
    displayName: Terraform Destroy (Manual Approval)
    dependsOn: Terraform
    jobs:
      - deployment: DestroyInfra
        displayName: Destroy Infra
        environment: terraform-destroy 
        strategy:
          runOnce:
            deploy:
              steps:
                  - checkout: self
                  - task: TerraformTask@5
                    inputs:
                      provider: 'azurerm'
                      command: 'destroy'
                      workingDirectory: '$(TF_WORKING_DIR)'
                      environmentServiceNameAzureRM: 'ado-terraform-oidc'
